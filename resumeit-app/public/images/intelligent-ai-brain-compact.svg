<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Intelligent brain gradient -->
    <linearGradient id="smartBrain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neural activity -->
    <linearGradient id="neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Intelligence spark -->
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main brain shape -->
  <path d="M12 28 Q8 18 18 12 Q24 8 32 10 Q40 8 46 12 Q56 18 52 28 Q56 35 48 44 Q42 50 34 46 Q28 52 22 46 Q14 50 8 40 Q6 32 12 28 Z" 
        fill="url(#smartBrain)" filter="url(#glow)"/>
  
  <!-- Hemisphere division -->
  <path d="M32 10 Q32 20 32 32 Q32 44 34 46" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  
  <!-- Left hemisphere folds -->
  <path d="M15 20 Q20 18 25 20 Q28 18 30 20" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  <path d="M12 28 Q17 26 22 28 Q27 26 30 28" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  <path d="M15 36 Q20 34 25 36 Q28 34 30 36" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  
  <!-- Right hemisphere folds -->
  <path d="M34 20 Q37 18 40 20 Q43 18 46 20" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  <path d="M34 28 Q37 26 40 28 Q43 26 46 28" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  <path d="M34 36 Q37 34 40 36 Q43 34 46 36" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/>
  
  <!-- Neural network nodes -->
  <g fill="url(#neural)">
    <circle cx="20" cy="22" r="2"/>
    <circle cx="32" cy="18" r="2.5"/>
    <circle cx="44" cy="22" r="2"/>
    <circle cx="18" cy="32" r="1.5"/>
    <circle cx="32" cy="28" r="3"/>
    <circle cx="46" cy="32" r="1.5"/>
    <circle cx="22" cy="40" r="1.5"/>
    <circle cx="42" cy="40" r="1.5"/>
  </g>
  
  <!-- Neural connections -->
  <g stroke="url(#neural)" stroke-width="0.8" fill="none" opacity="0.8">
    <path d="M20 22 L32 18"/>
    <path d="M32 18 L44 22"/>
    <path d="M20 22 L18 32"/>
    <path d="M44 22 L46 32"/>
    <path d="M18 32 L32 28"/>
    <path d="M32 28 L46 32"/>
    <path d="M18 32 L22 40"/>
    <path d="M46 32 L42 40"/>
    <path d="M32 28 L22 40"/>
    <path d="M32 28 L42 40"/>
  </g>
  
  <!-- Intelligence sparks -->
  <g fill="url(#spark)">
    <circle cx="24" cy="14" r="1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="14" r="1">
      <animate attributeName="opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="24" r="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="52" cy="24" r="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Central consciousness -->
  <circle cx="32" cy="28" r="1" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Data streams -->
  <g stroke="url(#neural)" stroke-width="0.5" fill="none" opacity="0.6">
    <path d="M8 32 Q12 30 16 32">
      <animate attributeName="stroke-dasharray" values="0,10;5,5;10,0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M48 32 Q52 30 56 32">
      <animate attributeName="stroke-dasharray" values="10,0;5,5;0,10" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
