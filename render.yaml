services:
  # Backend
  - type: web
    name: resumeit-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python minimal_backend.py
    envVars:
      - key: PORT
        value: 5000
    autoDeploy: true
    rootDir: backend

  # Frontend 
  - type: web
    name: resumeit-app
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3001
    rootDir: resumeit-app
